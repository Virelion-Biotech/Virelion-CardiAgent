[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virelion-cardiagent"
version = "0.3.0"
description = "Safe, reproducible cardiac challenge-agent specification and ML generation framework"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Virelion Biotech"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
ml = ["torch>=2.2"]
all = ["pytest>=8", "torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
