[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virelion-cardiagent"
version = "0.6.0"
description = "Safe, reproducible cardiac challenge-agent specification and ML generation framework"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Virelion Biotech"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "jsonschema>=4.22"]
joint = ["numpy>=1.26,<3", "scipy>=1.11,<2"]
ml = ["torch>=2.2"]
validation = ["scipy>=1.11,<2", "scikit-learn>=1.4,<2", "numpy>=1.26,<3"]
all = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "jsonschema>=4.22", "torch>=2.2", "scipy>=1.11,<2", "scikit-learn>=1.4,<2", "numpy>=1.26,<3"]

[project.scripts]
cardiagent = "cardiagent.cli:main"
cardiagent-hearttwin = "cardiagent.hearttwin_adapter:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
cardiagent = ["schemas/*.json"]
