name: CardiAgent tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m ruff check src tests scripts
      - run: python -m pytest -q
  cpu-ml:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[test,validation]"
      - run: python -m pytest -q --cov=cardiagent --cov-fail-under=80
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv /tmp/agent-wheel
      - run: /tmp/agent-wheel/bin/pip install dist/*.whl
      - run: /tmp/agent-wheel/bin/cardiagent doctor
      - run: /tmp/agent-wheel/bin/cardiagent benchmark --output-dir /tmp/agent-benchmarks
      - run: /tmp/agent-wheel/bin/python -c "from importlib.resources import files; assert files('cardiagent').joinpath('schemas/challenge-agent.schema.json').is_file()"
