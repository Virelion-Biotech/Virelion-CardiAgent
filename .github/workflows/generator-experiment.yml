name: Generator comparison experiment

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and ML dependencies
        run: python -m pip install -e ".[all]"
      - name: Run canonical multi-seed experiment
        run: python scripts/run_generator_experiment.py --output artifacts/generator-experiment.json
      - name: Validate artifact structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/generator-experiment.json")
          payload = json.loads(p.read_text(encoding="utf-8"))
          assert payload["artifact_version"] == "0.1"
          assert len(payload["fingerprint"]) == 64
          assert len(payload["experiment"]["seeds"]) >= 3
          print("artifact validated", payload["fingerprint"])
          PY
      - name: Upload experiment artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardiagent-generator-experiment
          path: artifacts/generator-experiment.json
